site_name: AI Agent HandBook
site_url: https://ai-agent-handbook-6wn.pages.dev/
site_description: 企业级 AI Agent 全生命周期实践白皮书
docs_dir: docs
use_directory_urls: false
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
repo_url: https://github.com/kuromikoto/ai-agent-handbook
edit_uri: blob/main/
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - 首页: README.md
  - 2026 Agent 开发者调研报告: 2026-agent-survey-report.md
  - 前言: 00-preface/00-preface.md
